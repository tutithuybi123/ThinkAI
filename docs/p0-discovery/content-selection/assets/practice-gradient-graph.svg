<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" role="img" aria-labelledby="title desc">
  <title id="title">Đồ thị quan hệ tuyến tính qua A(1; 3) và B(4; 9)</title>
  <desc id="desc">Hệ trục tọa độ x từ 0 đến 5 và y từ 0 đến 10, mỗi ô một đơn vị. Đường thẳng đi qua điểm A có tọa độ 1;3 và B có tọa độ 4;9.</desc>
  <rect width="480" height="360" fill="white"/>
  <g stroke="#cbd5e1" stroke-width="1">
    <path d="M70 40V300 M96 40V300 M122 40V300 M148 40V300 M174 40V300 M200 40V300 M70 300H200 M70 274H200 M70 248H200 M70 222H200 M70 196H200 M70 170H200 M70 144H200 M70 118H200 M70 92H200 M70 66H200 M70 40H200"/>
  </g>
  <g stroke="#0f172a" stroke-width="2">
    <path d="M70 300H230 M70 320V25"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#0f172a">
    <text x="235" y="305">x</text><text x="62" y="22">y</text>
    <text x="66" y="318">0</text><text x="92" y="318">1</text><text x="118" y="318">2</text><text x="144" y="318">3</text><text x="170" y="318">4</text><text x="196" y="318">5</text>
    <text x="48" y="278">1</text><text x="48" y="252">2</text><text x="48" y="226">3</text><text x="48" y="200">4</text><text x="48" y="174">5</text><text x="48" y="148">6</text><text x="48" y="122">7</text><text x="48" y="96">8</text><text x="48" y="70">9</text><text x="40" y="44">10</text>
  </g>
  <path d="M83 300 L213 40" stroke="#2563eb" stroke-width="3"/>
  <g fill="#dc2626"><circle cx="96" cy="222" r="5"/><circle cx="174" cy="66" r="5"/></g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#991b1b"><text x="102" y="216">A(1; 3)</text><text x="180" y="60">B(4; 9)</text></g>
</svg>
