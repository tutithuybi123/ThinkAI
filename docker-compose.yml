services:
  app:
    build: .
    env_file: .env.production
    environment:
      # Compose interpolates this from the deployment environment.  `env_file`
      # values are otherwise passed through literally, which would leave the
      # database password placeholder unresolved inside the app container.
      THINKAI_DATABASE_URL: postgresql://thinkai:${POSTGRES_PASSWORD}@postgres:5432/thinkai
      THINKAI_PUBLIC_DEMO_MODE: ${THINKAI_PUBLIC_DEMO_MODE:-0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose: ["3000"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thinkai
      POSTGRES_USER: thinkai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["thinkai-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U thinkai -d thinkai"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    expose: ["5432"]
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]
    restart: unless-stopped
volumes:
  thinkai-postgres:
