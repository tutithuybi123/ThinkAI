services:
  app:
    build: .
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose: ["3000"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thinkai
      POSTGRES_USER: thinkai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["thinkai-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U thinkai -d thinkai"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    expose: ["5432"]
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on: [app]
    restart: unless-stopped
volumes:
  thinkai-postgres:
